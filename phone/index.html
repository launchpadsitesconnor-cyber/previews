<!doctype html><html><head><meta charset="utf-8"><title>Phone view</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#1e293b,#020617);display:flex;
align-items:center;justify-content:center;font-family:system-ui}
.ph{width:390px;height:844px;max-height:92vh;aspect-ratio:390/844;border-radius:54px;background:#000;padding:14px;
box-shadow:0 40px 120px rgba(0,0,0,.6),inset 0 0 0 2px #333}
.ph iframe{width:100%;height:100%;border:0;border-radius:42px;background:#fff}</style></head><body>
<div class="ph"><iframe id="f"></iframe></div><script>try{localStorage.setItem('skipgc','t')}catch(e){}
var s=new URLSearchParams(location.search).get('s')||'';if(/^[a-z0-9-]+$/.test(s))document.getElementById('f').src='../'+s+'/';
</script></body></html>
