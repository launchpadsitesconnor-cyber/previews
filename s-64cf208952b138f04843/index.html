.row:first-child{border-top:0}.row .n{font-weight:600}.row .m{color:var(--muted);font-size:.83rem}

.empty{color:var(--muted);padding:14px}
footer{color:var(--muted);font-size:.8rem;margin-top:22px;text-align:center}
