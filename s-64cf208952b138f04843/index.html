    ${c.phone ? `<a class="btn call" href="tel:${esc(tel(c.phone))}">📞 ${esc(c.phone)}</a><a class="btn" href="${esc(sms(c))}">Text link</a>` : `<span class="m" style="align-self:center">no phone on file</span>`}</div></div>`).join("")
    || `<div class="empty">No match${q ? " for “" + esc(q) + "”" : ""}.</div>`)
    + (res.length > show.length ? `<div class="empty">${res.length - show.length} more — type to narrow it down.</div>` : "");
  $("#cnt").textContent = res.length + " of " + ALL.length;
}
window.openCV = (i) => {
  const c = ALL[i];
  $("#cv .n").textContent = c.name;
  $("#cv .m").textContent = [c.town, (c.price ? money(c.price) + (c.mo ? " + " + money(c.mo) + "/mo" : "") : ""), c.phone].filter(Boolean).join(" · ");
  $("#cv .acts").innerHTML = (c.phone ? `<a class="btn call" href="tel:${esc(tel(c.phone))}">📞 Call</a><a class="btn" href="${esc(sms(c))}">Text link</a>` : "")
    + `<a class="btn" href="${esc(mine(c.url))}" target="_blank" rel="noopener">Full screen ↗</a>`;
  $("#cv iframe").src = mine(c.url);
  $("#cv").classList.add("on"); document.body.style.overflow = "hidden";
  history.pushState({cv: 1}, "");
};
const closeCV = () => { $("#cv").classList.remove("on"); $("#cv iframe").src = "about:blank"; document.body.style.overflow = ""; };
window.addEventListener("popstate", closeCV);
if (ALL.length) {
  const box = document.createElement("div");
  box.innerHTML = `<h2>Find a business</h2><div class="search"><input id="q" type="search" placeholder="Name, town, type or phone…" autocomplete="off">
    <div class="filters">${[["all","All"],["calls","Callable"],["emailed","Emailed"],["call_list","Call list"],["interested","Interested"],["pending_price","Waiting on you"],["approved","Ready to send"]]
      .map(([k,l]) => `<button data-f="${k}"${k==="all"?' class="on"':""}>${l}</button>`).join("")}</div>
    <div class="m" id="cnt" style="padding-top:6px"></div></div><div class="list" id="res"></div>`;
  const anchor = document.querySelector("#app h2");
  anchor ? $("#app").insertBefore(box, anchor) : $("#app").appendChild(box);
  $("#q").addEventListener("input", draw);
  box.querySelectorAll(".filters button").forEach(b => b.onclick = () => {
    filt = b.dataset.f; box.querySelectorAll(".filters button").forEach(x => x.classList.toggle("on", x === b)); draw(); });
  draw();
}
</script></body></html>
