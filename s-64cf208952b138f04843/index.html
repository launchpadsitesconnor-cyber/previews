*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}

a{color:var(--cyan)}

.alert{background:#2a1a10;border:1px solid #5a3a1c;color:#ffd9a8;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.alert.red{background:#2a1014;border-color:#5a1c24;color:#ffc2c8}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}.row .n{font-weight:600}.row .m{color:var(--muted);font-size:.83rem}
.chip{font-size:.75rem;padding:3px 9px;border-radius:999px;background:#10283a;color:var(--muted);white-space:nowrap}
.chip.emailed{color:var(--cyan)}.chip.interested,.chip.replied{color:var(--warn);background:#2a1f0e}.chip.won{color:var(--good);background:#0e2a1d}
.feed .row{display:block}.feed .t{color:var(--muted);font-size:.78rem}.feed .success{color:#c8f5df}.feed .warn{color:#ffd9a8}
.empty{color:var(--muted);padding:14px}
footer{color:var(--muted);font-size:.8rem;margin-top:22px;text-align:center}
